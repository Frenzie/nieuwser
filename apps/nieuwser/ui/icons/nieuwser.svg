<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" role="img" aria-labelledby="title description">
  <title id="title">Origami newspaper bird</title>
  <desc id="description">A folded newspaper bird on a blue-to-orange gradient tile.</desc>
  <defs>
    <linearGradient id="sky" x1="0.28" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#075092"/>
      <stop offset="0.42" stop-color="#087db2"/>
      <stop offset="0.7" stop-color="#3197a5"/>
      <stop offset="1" stop-color="#f79424"/>
    </linearGradient>
    <radialGradient id="sunset" cx="0.48" cy="0.88" r="0.58">
      <stop offset="0" stop-color="#ffb52d" stop-opacity="0.98"/>
      <stop offset="0.48" stop-color="#ff9828" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#ff9828" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e8e7e2"/>
    </linearGradient>
    <linearGradient id="paperShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f4ef"/>
      <stop offset="1" stop-color="#c9c9c5"/>
    </linearGradient>
    <pattern id="newsDots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.62" fill="#555b5e" opacity="0.48"/>
      <circle cx="3.7" cy="3.4" r="0.48" fill="#717579" opacity="0.34"/>
    </pattern>
    <pattern id="fineLines" width="34" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 2H31 M0 5H27 M0 8H32 M0 11H22" stroke="#707478" stroke-width="0.75" opacity="0.56"/>
    </pattern>
    <clipPath id="tile">
      <rect width="768" height="768" rx="154"/>
    </clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="768" height="768" fill="url(#sky)"/>
    <rect width="768" height="768" fill="url(#sunset)"/>

    <g filter="url(#lift)" stroke-linejoin="round">
      <!-- Rear folded sheet and narrow beak-side plane -->
      <path d="M410 176 650 145 493 330 431 391 391 346Z" fill="url(#paperShade)" stroke="#c9c9c6" stroke-width="1.5"/>
      <path d="M410 176 650 145 548 195 492 330Z" fill="#f7f7f5"/>
      <path d="M548 195 650 145 493 330Z" fill="url(#newsDots)" opacity="0.8"/>
      <path d="M556 204 624 176 M548 214 610 190 M539 224 603 201 M531 234 596 211" fill="none" stroke="#74797b" stroke-width="1.2" opacity="0.7"/>

      <!-- Left paper wing -->
      <path d="M194 416 130 273 210 274 318 319Z" fill="url(#paper)" stroke="#d1d1cd" stroke-width="1.5"/>
      <path d="M194 416 130 273 210 274 318 319Z" fill="url(#newsDots)" opacity="0.78"/>
      <path d="M130 273 92 328 155 318Z" fill="#f5f4f0" stroke="#d1d1cd" stroke-width="1.5"/>
      <path d="M130 273 155 318 92 328Z" fill="url(#paperShade)" opacity="0.78"/>

      <!-- Tall leading fold -->
      <path d="M194 416 326 188 615 104 423 383Z" fill="url(#paper)" stroke="#dededb" stroke-width="1.5"/>
      <path d="M326 188 615 104 423 383Z" fill="url(#newsDots)" opacity="0.74"/>
      <path d="M326 188 423 383 194 416Z" fill="#fbfbf9"/>
      <path d="M326 188 423 383 194 416Z" fill="url(#newsDots)" opacity="0.34"/>
      <path d="M194 416 326 188 M423 383 615 104" fill="none" stroke="#bfc1c0" stroke-width="2" opacity="0.8"/>

      <!-- Body and long downward tail -->
      <path d="M194 416 423 383 499 555 390 477 314 448Z" fill="url(#paper)" stroke="#d0d0cc" stroke-width="1.5"/>
      <path d="M423 383 499 555 431 525 414 425Z" fill="url(#paperShade)" stroke="#c8c8c4" stroke-width="1.5"/>
      <path d="M423 383 499 555 431 525 414 425Z" fill="url(#newsDots)" opacity="0.68"/>
      <path d="M194 416 314 448 390 477 423 383Z" fill="#f4f3ef" stroke="#d4d4d0" stroke-width="1"/>

      <!-- Printed newspaper block on the body -->
      <g transform="translate(215 412) rotate(-8)" fill="#40464a">
        <rect x="0" y="0" width="28" height="10" fill="#65696b"/>
        <text x="34" y="13" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="0.3">THE GLOBAL NEWS</text>
        <path d="M0 19H174" stroke="#686d70" stroke-width="1.4"/>
        <text x="0" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="5.6" font-weight="700">A new perspective on the world</text>
        <text x="0" y="39" font-family="Georgia, 'Times New Roman', serif" font-size="4.5">Stories and ideas, gathered from across the globe.</text>
        <text x="0" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="4.5">The latest reports, analysis and discoveries.</text>
        <rect x="99" y="24" width="54" height="37" fill="#85898a"/>
        <path d="M101 54 114 38 123 46 136 30 151 55Z" fill="#d2d2cf"/>
        <circle cx="136" cy="32" r="4" fill="#e6e5e1"/>
        <rect x="0" y="52" width="91" height="1.2" fill="#727779"/>
        <rect x="0" y="57" width="87" height="1.2" fill="#727779"/>
        <rect x="0" y="62" width="93" height="1.2" fill="#727779"/>
      </g>

      <!-- Fine print on the tail -->
      <path d="M432 444 455 491 M438 440 461 486 M444 436 467 481 M450 432 473 477 M456 428 479 472" fill="none" stroke="#62696d" stroke-width="1.2" opacity="0.72"/>
      <path d="M435 464 468 450 M439 472 472 458 M443 480 476 466 M447 488 480 474 M451 496 484 482" fill="none" stroke="#676d70" stroke-width="1" opacity="0.58"/>
      <path d="M431 525 499 555 453 532Z" fill="#fff" opacity="0.75"/>
    </g>
  </g>
</svg>