[workspace]
resolver = "3"
members = ["crates/nieuwser-core", "crates/nieuwser-cli", "apps/nieuwser"]

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-fontique-012"] }
slint-build = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"

[profile.dev]
debug = 1

[profile.release]
debug = 0
lto = "thin"
codegen-units = 1
strip = "symbols"

# Slint 1.19 is not on crates.io yet, so build it from the `pre-release/1.19`
# branch. Remove this block once 1.19.0 is published; the version constraints
# above (slint = "1") then resolve to it without further changes.
[patch.crates-io]
slint = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
slint-build = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
slint-macros = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
i-slint-core = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
i-slint-core-macros = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
i-slint-common = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
i-slint-compiler = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
i-slint-backend-selector = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
i-slint-backend-winit = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
i-slint-backend-testing = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
i-slint-renderer-femtovg = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
i-slint-renderer-software = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.19" }
